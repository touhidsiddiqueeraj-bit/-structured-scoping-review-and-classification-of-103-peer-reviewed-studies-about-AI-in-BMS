                    - generic [ref=f52e156]:
                      - heading "1. Introduction" [level=2] [ref=f52e157]
                      - generic [ref=f52e158]:
                        - text: The growing electrification of vehicles and the tightening of environmental regulations have significantly increased interest in electric vehicles (EVs) [
                        - link "Reference 1" [ref=f52e159] [cursor=pointer]: "1"
                        - text: ","
                        - link "Reference 2" [ref=f52e160] [cursor=pointer]: "2"
                        - text: "]. However, concerns regarding driving range limitations and safety remain major challenges. Both issues are closely linked to the thermal management of electric and electronic components, particularly the battery. Lithium-ion batteries, widely used in EVs, operate optimally within a temperature range of 15 °C to 35 °C. Operating a battery outside of its optimal temperature range can significantly affect its performance and safety. At low temperatures, increased internal resistance and lithium plating on the anode can degrade performance. At high temperatures, accelerated electrochemical reactions at both electrodes compromise stability and reduce battery life. Moreover, excessive heat can lead to critical safety risks, such as thermal runaway or explosion ["
                        - link "Reference 3" [ref=f52e161] [cursor=pointer]: "3"
                        - text: ","
                        - link "Reference 4" [ref=f52e162] [cursor=pointer]: "4"
                        - text: ","
                        - link "Reference 5" [ref=f52e163] [cursor=pointer]: "5"
                        - text: ","
                        - link "Reference 6" [ref=f52e164] [cursor=pointer]: "6"
                        - text: ","
                        - link "Reference 7" [ref=f52e165] [cursor=pointer]: "7"
                        - text: "]. In particular, thermal runaway in lithium-ion batteries typically begins near 65 °C with the decomposition of the SEI, making battery thermal management essential. Consequently, extensive studies have been conducted to enable efficient battery cooling within the battery pack to prevent thermal runaway. Various approaches have been proposed, including the integration of PCM with micro-channel plate cooling systems, hybrid PCM–metal foam and immersion cooling technologies, and the use of nanofluids with superior thermal conductivity ["
                        - link "Reference 8" [ref=f52e166] [cursor=pointer]: "8"
                        - text: ","
                        - link "Reference 9" [ref=f52e167] [cursor=pointer]: "9"
                        - text: ","
                        - link "Reference 10" [ref=f52e168] [cursor=pointer]: "10"
                        - text: ","
                        - link "Reference 11" [ref=f52e169] [cursor=pointer]: "11"
                        - text: "]."
                      - generic [ref=f52e170]: To maintain battery temperature within the optimal range, EVs are equipped with Battery Thermal Management Systems (BTMSs). Various BTMS configurations have been developed, with the most common being air cooling, liquid cooling, and phase change material (PCM)-based systems.
                      - generic [ref=f52e171]:
                        - text: Air cooling systems utilize ambient air to directly cool the battery modules. This method offers a simple structure and low cost; however, it suffers from low heat transfer efficiency and limited performance under high ambient temperatures. Liquid cooling systems, on the other hand, use a circulating coolant to absorb heat from the battery and release it through a radiator. While this method provides significantly improved thermal performance compared to air cooling, it comes with increased system complexity and higher implementation costs [
                        - link "Reference 12" [ref=f52e172] [cursor=pointer]: "12"
                        - text: ","
                        - link "Reference 13" [ref=f52e173] [cursor=pointer]: "13"
                        - text: "]."
                      - generic [ref=f52e174]:
                        - text: "PCM-based thermal management has emerged as an alternative approach and is typically classified into two main types: direct and secondary loop systems. In the direct method, the PCM is in direct contact with the battery cells, offering the highest cooling performance due to efficient heat absorption during phase transition. However, this configuration is sensitive to PCM leakage, which poses reliability concerns ["
                        - link "Reference 14" [ref=f52e175] [cursor=pointer]: "14"
                        - text: "]."
                      - generic [ref=f52e176]:
                        - text: The secondary loop approach addresses this issue by thermally decoupling the PCM from the battery. In this configuration, the PCM regulates the temperature of a coolant loop, which then indirectly cools the battery pack. Although the thermal efficiency is somewhat reduced and the system becomes more complex, this method eliminates the risk of PCM leakage and enables greater flexibility in system design. Specifically, the coolant loop can be extended to cool additional components, such as electric motors and inverters, allowing for integrated thermal management [
                        - link "Reference 15" [ref=f52e177] [cursor=pointer]: "15"
                        - text: "]."
                      - generic [ref=f52e178]: Due to these advantages, recent electric vehicles have adopted the PCM-based secondary loop BTMS. Accordingly, this study focuses on a BTMS that employs a PCM-based secondary loop configuration as its core cooling strategy.
                      - generic [ref=f52e179]:
                        - text: However, operating BTMS components, such as the refrigeration cycle and coolant loop, consumes significant energy. Studies indicate that heating and cooling operations in EVs can reduce driving range by up to 50% [
                        - link "Reference 16" [ref=f52e180] [cursor=pointer]: "16"
                        - text: "]. Therefore, an effective control strategy is essential to minimize energy consumption while ensuring battery temperature remains within the optimal range."
                      - generic [ref=f52e181]:
                        - text: Existing BTMS control strategies primarily rely on rule-based controllers, proportional–integral–derivative (PID) controllers [
                        - link "Reference 17" [ref=f52e182] [cursor=pointer]: "17"
                        - text: ","
                        - link "Reference 18" [ref=f52e183] [cursor=pointer]: "18"
                        - text: "], and fuzzy logic controllers ["
                        - link "Reference 19" [ref=f52e184] [cursor=pointer]: "19"
                        - text: ","
                        - link "Reference 20" [ref=f52e185] [cursor=pointer]: "20"
                        - text: "]. These control strategies offer the advantage of ease of implementation and minimal computational burden, as complex mathematical models are not required. However, incorporating system constraints and adapting to dynamic driving conditions and external disturbances are challenging, making it difficult to derive optimal control inputs and ensure minimal energy consumption ["
                        - link "Reference 21" [ref=f52e186] [cursor=pointer]: "21"
                        - text: ","
                        - link "Reference 22" [ref=f52e187] [cursor=pointer]: "22"
                        - text: "]. To address this limitation, optimal control-based approaches, such as Model Predictive Control (MPC), have been explored ["
                        - link "Reference 23" [ref=f52e188] [cursor=pointer]: "23"
                        - text: ","
                        - link "Reference 24" [ref=f52e189] [cursor=pointer]: "24"
                        - text: ","
                        - link "Reference 25" [ref=f52e190] [cursor=pointer]: "25"
                        - text: "]. MPC predicts the future states of a system using a mathematical model and determines future control inputs by optimizing a cost function to achieve control objectives. In the case of a BTMS, MPC can predict future battery heat generation and regulate battery temperature while improving energy efficiency by designing a cost function that considers both battery temperature and energy consumption. However, its effectiveness depends on the accuracy of the control model and the length of the prediction horizon. Due to computational constraints, many BTMS studies employ simplified models, often at the cost of reduced accuracy."
                      - generic [ref=f52e191]:
                        - text: Another promising approach is Stochastic Dynamic Programming (SDP) [
                        - link "Reference 26" [ref=f52e192] [cursor=pointer]: "26"
                        - text: "], which determines optimal control inputs for stochastic systems. In BTMS applications, SDP predicts probabilistic future heat generation based on vehicle driving conditions and adjusts control inputs accordingly. However, similarly to MPC, SDP’s performance depends on the accuracy of state transition probabilities. Although detailed models provide higher accuracy, they inherently increase the number of system states. In conventional optimization problems, computational complexity tends to grow proportionally to the cube of the number of states, making real-time operation challenging ["
                        - link "Reference 27" [ref=f52e193] [cursor=pointer]: "27"
                        - text: "]."
                      - generic [ref=f52e194]: This study proposes an MPC-based control strategy utilizing a BTMS model designed to balance accuracy and computational efficiency. BTMS involves complex phenomena, such as fluid flow, two-phase heat transfer, and heat exchange, making numerical models computationally demanding and unsuitable for real-time control. To overcome this challenge, an artificial neural network (ANN) is employed to develop a high-accuracy, computationally efficient, optimization-oriented model. Using this ANN-based control model, an MPC framework is designed to minimize BTMS energy consumption while maintaining battery temperature within the optimal range. Furthermore, this study introduces an infinity-horizon MPC to mitigate control input oscillations, a common issue in conventional MPC implementations.
                      - generic [ref=f52e195]:
                        - text: The remainder of this paper is organized as follows.
                        - link "Section 2" [ref=f52e196] [cursor=pointer]:
                          - /url: "#sec2-wevj-16-00279"
                        - text: presents the optimization-oriented model design.
                        - link "Section 3" [ref=f52e197] [cursor=pointer]:
                          - /url: "#sec3-wevj-16-00279"
                        - text: details the controller design.
                        - link "Section 4" [ref=f52e198] [cursor=pointer]:
                          - /url: "#sec4-wevj-16-00279"
                        - text: validates the proposed controller. Finally,
                        - link "Section 5" [ref=f52e199] [cursor=pointer]:
                          - /url: "#sec5-wevj-16-00279"
                        - text: concludes the study.
                    - generic [ref=f52e201]:
                      - heading "2. BTMS Control Model" [level=2] [ref=f52e202]
                      - generic [ref=f52e203]:
                        - heading "2.1. BTMS Operation" [level=3] [ref=f52e204]
                        - generic [ref=f52e205]:
                          - text: The BTMS in EVs consists of a coolant loop that regulates battery temperature and a refrigeration cycle that controls the coolant temperature, as illustrated in
                          - link "Figure 1" [ref=f52e206] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f001"
                          - text: . The system operates in two modes depending on how the coolant temperature is managed.
                        - generic [ref=f52e207]:
                          - button [aria-hidden] [ref=f52e208] [cursor=pointer]
                          - button "View figure 1" [ref=f52e213] [cursor=pointer]
                          - generic [ref=f52e214]: Figure 1. Thermal management system of an electric vehicle.
                        - generic [ref=f52e215]:
                          - text: The first mode is the refrigeration cycle mode, shown schematically in
                          - link "Figure 2" [ref=f52e216] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f002"
                          - text: a. In this mode, the coolant temperature is reduced through heat exchange with a low-temperature refrigerant in the coolant chiller. This mode provides high cooling performance, making it suitable for scenarios where ambient temperatures are excessively high or the battery generates substantial heat. However, it requires significant energy consumption due to the operation of the refrigeration cycle. A previous study reported experimental results, with a significant driving range reduction up to 16.7% due to use of the refrigeration cycle for cooling [
                          - link "Reference 16" [ref=f52e217] [cursor=pointer]: "16"
                          - text: "]."
                        - generic [ref=f52e218]:
                          - button [aria-hidden] [ref=f52e219] [cursor=pointer]
                          - button "View figure 2" [ref=f52e224] [cursor=pointer]
                          - generic [ref=f52e225]: Figure 2. Schematic diagram of the thermal management system of an electric vehicle. (a) Refrigeration mode. (b) Radiator mode.
                        - generic [ref=f52e226]:
                          - text: The second mode is the radiator mode, depicted in
                          - link "Figure 2" [ref=f52e227] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f002"
                          - text: b. Here, the coolant temperature is controlled by ambient air through a radiator. While this mode offers lower cooling performance than the refrigeration cycle, it significantly reduces energy consumption.
                      - generic [ref=f52e228]:
                        - heading "2.2. Model Structure" [level=3] [ref=f52e229]
                        - generic [ref=f52e230]:
                          - text: The BTMS is typically modeled by considering compressible and incompressible fluid flows, phase changes in two-phase fluids, and heat exchange processes within heat exchangers.
                          - link "Figure 3" [ref=f52e231] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f003"
                          - text: presents the input/output signals and the internal computational functions associated with the BTMS control model. Notably, the gray-shaded regions in
                          - link "Figure 3" [ref=f52e232] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f003"
                          - text: a,b encapsulate the majority of the complex and nonlinear computational procedures inherent to the BTMS, as mentioned above. Obtaining numerical solutions within these regions requires iterative computations until convergence is achieved [
                          - link "Reference 28" [ref=f52e233] [cursor=pointer]: "28"
                          - text: "]. Moreover, due to the large number of parameters involved in this computation process, numerous assumptions are typically required, which can significantly compromise both the real-time performance and the overall accuracy of the control system."
                        - generic [ref=f52e234]:
                          - button [aria-hidden] [ref=f52e235] [cursor=pointer]
                          - button "View figure 3" [ref=f52e240] [cursor=pointer]
                          - generic [ref=f52e241]: Figure 3. Input/output signals and required internal functions for (a) Refrigeration cycle mode and (b) Radiator mode.
                        - generic [ref=f52e242]:
                          - text: To address these challenges, this study employs an artificial neural network (ANN)-based data-driven approach to model the BTMS. An ANN provides advantages, such as high-speed information processing, mapping capabilities, and fault tolerance [
                          - link "Reference 29" [ref=f52e243] [cursor=pointer]: "29"
                          - text: ","
                          - link "Reference 30" [ref=f52e244] [cursor=pointer]: "30"
                          - text: ","
                          - link "Reference 31" [ref=f52e245] [cursor=pointer]: "31"
                          - text: "]. To address this, the complex heat transfer and energy equations illustrated in the gray-shaded regions of"
                          - link "Figure 3" [ref=f52e246] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f003"
                          - text: were modeled using an ANN, as shown in the corresponding gray-shaded areas in
                          - link "Figure 4" [ref=f52e247] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f004"
                          - text: a,b. Additionally, other components, such as pump power, compressor power, and battery thermal dynamics, are modeled using mathematical equations with lookup tables, as shown in the light-blue-shaded region in
                          - link "Figure 4" [ref=f52e248] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f004"
                          - text: . To perform this calculation for the compressor, the compressor’s mass flow rate, isentropic efficiency, and power conversion efficiency are required. These parameters are provided in the form of lookup tables based on compressor speed, the pressure ratio, and torque, as illustrated in
                          - link "Figure 5" [ref=f52e249] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f005"
                          - text: . Similarly, for the pump, the coolant mass flow rate and mechanical power are given as functions of pump RPM, while the pump’s power conversion efficiency is represented as a function of pump RPM and torque, as shown in
                          - link "Figure 6" [ref=f52e250] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f006"
                          - text: .
                        - generic [ref=f52e251]:
                          - button [aria-hidden] [ref=f52e252] [cursor=pointer]
                          - button "View figure 4" [ref=f52e257] [cursor=pointer]
                          - generic [ref=f52e258]: Figure 4. ANN-based modeling approach for (a) Refrigeration cycle mode and (b) Radiator mode.
                        - generic [ref=f52e259]:
                          - button [aria-hidden] [ref=f52e260] [cursor=pointer]
                          - button "View figure 5" [ref=f52e265] [cursor=pointer]
                          - generic [ref=f52e266]: Figure 5. Compressor performance characteristics, (a) mass flow rate, (b) overall compressor efficiency, and (c) power conversion efficiency of compressor motor.
                        - generic [ref=f52e267]:
                          - button [aria-hidden] [ref=f52e268] [cursor=pointer]
                          - button "View figure 6" [ref=f52e273] [cursor=pointer]
                          - generic [ref=f52e274]: Figure 6. Pump performance characteristics, (a) mass flow rate, (b) mechanical power of pump, and (c) power conversion efficiency of pump motor.
                      - generic [ref=f52e275]:
                        - heading "2.3. Model for the Refrigeration Cycle with the Coolant Cycle" [level=3] [ref=f52e276]
                        - generic [ref=f52e277]:
                          - text: In refrigeration mode, an ANN is developed to approximate the refrigeration cycle’s characteristics, including heat exchange in the condenser, the battery chiller, and the battery, as shown in
                          - link "Figure 4" [ref=f52e278] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f004"
                          - text: a. The input signals of the ANN are the compressor speed, pump speed, battery temperature, and ambient temperature. The output signals of the ANN include the pressure and specific enthalpy at the compressor inlet/outlet and the temperature increase of the coolant passing through the battery. The ANN structure consists of two hidden layers with eight nodes each, using the ReLU activation function to balance computational efficiency and accuracy.
                      - generic [ref=f52e279]:
                        - heading "2.4. Model for the Coolant Cycle" [level=3] [ref=f52e280]
                        - generic [ref=f52e281]:
                          - text: In radiator mode, an ANN approximates heat exchange in the radiator and the battery, as indicated in
                          - link "Figure 4" [ref=f52e282] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f004"
                          - text: b. The input signals of the ANN are the battery temperature, ambient temperature, and pump speed. The output signal of the ANN is the coolant temperature increase at the battery inlet/outlet. The ANN structure mirrors that of the refrigeration cycle mode for consistency in computational efficiency and accuracy.
                      - generic [ref=f52e283]:
                        - heading "2.5. Battery Thermal Model" [level=3] [ref=f52e284]
                        - generic [ref=f52e285]:
                          - text: "The battery thermal dynamics are expressed as follows:"
                          - generic [ref=f52e286]: (1)
                          - text: where is the rate of battery temperature change, is the battery’s heat generation, is the cooling rate,
                          - generic [ref=f52e383]:
                            - text: m
                            - subscript [ref=f52e384]: batt
                          - text: is the battery’s thermal mass, and
                          - generic [ref=f52e385]:
