                    - generic [ref=f52e2306]:
                      - heading "4. Controller Validation" [level=2] [ref=f52e2307]
                      - generic [ref=f52e2308]: To validate the performance of the proposed MPC, a comparative analysis was conducted against a conventional rule-based controller for the BTMS. The rule-based controller was configured to operate both actuators at maximum speed when the battery temperature exceeded the upper limit of the desired temperature range and to deactivate both actuators when the battery temperature dropped below the lower limit. Additionally, a minimum operating speed of 20% of the maximum speed was set for each actuator. The rule-based controller used for validation was designed as a hypothetical construct for the purpose of comparison.
                      - generic [ref=f52e2309]:
                        - text: For the simulation, a combined driving cycle consisting of US06, SC03, and UDDS cycles was used. The corresponding vehicle speed profile is depicted in the first graph of
                        - link "Figure 12" [ref=f52e2310] [cursor=pointer]:
                          - /url: "#wevj-16-00279-f012"
                        - text: . The second and third plots in
                        - link "Figure 12" [ref=f52e2311] [cursor=pointer]:
                          - /url: "#wevj-16-00279-f012"
                        - text: depict the battery current and the heat generation of the battery under the given driving cycle. The control time step was set to 1 s and the prediction horizon for the proposed MPC was set to 60 s. Additionally, the disturbance or battery heat generation during prediction horizon was estimated using a zero-order-hold model.
                      - generic [ref=f52e2312]:
                        - button [aria-hidden] [ref=f52e2313] [cursor=pointer]
                        - button "View figure 12" [ref=f52e2318] [cursor=pointer]
                        - generic [ref=f52e2319]: Figure 12. US06-SC03-UDDS combined driving cycle and corresponding battery current input and battery heat generation.
                      - generic [ref=f52e2320]:
                        - link "Figure 13" [ref=f52e2321] [cursor=pointer]:
                          - /url: "#wevj-16-00279-f013"
                        - text: presents the results for ambient temperatures of 25 °C, 30 °C, and 35 °C, respectively. In each figure, the red lines represent the results of the proposed controller, while the blue lines represent the results of the rule-based controller.
                      - generic [ref=f52e2322]:
                        - button [aria-hidden] [ref=f52e2323] [cursor=pointer]
                        - button "View figure 13" [ref=f52e2328] [cursor=pointer]
                        - generic [ref=f52e2329]: Figure 13. Controller validation results when (a) the ambient temperature is 25 °C, (b) the ambient temperature is 30 °C, and (c) the ambient temperature is 35 °C.
                      - generic [ref=f52e2330]: When the ambient temperature was 25 °C, the proposed controller actively utilized the radiator mode while avoiding the use of the refrigeration cycle mode. As a result, the proposed controller significantly reduced energy consumption compared to the rule-based controller while maintaining the battery temperature within the desired operating range.
                      - generic [ref=f52e2331]: When the ambient temperature was 30 °C, the proposed controller switched between the refrigeration cycle mode and the radiator mode based on battery heat generation and temperature conditions. This adaptive control strategy allowed the proposed controller to maintain the battery temperature within the desired operating range while reducing energy consumption by approximately 42.52% compared to the rule-based controller.
                      - generic [ref=f52e2332]:
                        - text: When the ambient temperature was 35 °C, neither the proposed controller nor the rule-based controller utilized the radiator mode due to the high ambient temperature. However, the optimized actuators in the proposed controller operated in more efficient regions compared to the rule-based controller. This is because the cost function of the proposed controller incorporates the power consumption characteristics of the actuators, allowing it to reflect and exploit their optimal efficiency ranges. As illustrated in
                        - link "Figure 14" [ref=f52e2333] [cursor=pointer]:
                          - /url: "#wevj-16-00279-f014"
                        - text: ", the proposed control strategy achieves an average COP of 4.23 for the refrigeration cycle, whereas the rule-based control approach yields a COP of 3.33. This indicates that the proposed strategy operates the actuators within more energy-efficient regions of the cycle, thereby also reducing overall energy consumption. As a result, the proposed controller achieved a 30.05% reduction in energy consumption compared to the rule-based controller."
                      - generic [ref=f52e2334]:
                        - button [aria-hidden] [ref=f52e2335] [cursor=pointer]
                        - button "View figure 14" [ref=f52e2340] [cursor=pointer]
                        - generic [ref=f52e2341]: Figure 14. Energy consumption and refrigeration cycle COP under ambient temperature 35 °C condition.
                      - generic [ref=f52e2342]:
                        - text: Additionally, a comparison of energy consumption with other studies employing different control strategies is presented in
                        - link "Table 1" [ref=f52e2343] [cursor=pointer]:
                          - /url: "#wevj-16-00279-t001"
                        - text: . Although a completely fair comparison is not possible due to differences in system specifications and simulation conditions, the effectiveness of the proposed method is evaluated by comparing the energy consumption reduction achieved under conditions as similar as possible. In particular, under the ambient temperature condition of 25 °C, the proposed control strategy effectively utilizes the radiator mode, which is not employed in other studies, resulting in a substantial reduction in BTMS energy consumption.
                      - generic [ref=f52e2344]:
