                      - heading "3. Controller Design" [level=2] [ref=f52e755]
                      - generic [ref=f52e756]:
                        - text: For MPC formulation, control model is expressed as
                        - generic [ref=f52e757]: (6)
                        - text: "where x represents the state, u is the control input, and w denotes the system disturbance. The system states include battery temperature and the speeds of the pump and compressor from the previous time step. The control inputs consist of the mode change command and the time derivatives of the compressor and pump speeds. The disturbance is battery heat generation. The mathematical representations of the state, control input, and disturbance are as follows:"
                        - generic [ref=f52e787]: (7)
                      - generic [ref=f52e916]: The choice of time derivatives of compressor and pump speeds as control variables is motivated by the need to mitigate excessive speed fluctuations. By regulating acceleration rather than directly controlling speed, abrupt variations can be effectively attenuated, leading to smoother system operation.
                      - generic [ref=f52e917]:
                        - heading "3.1. Conventional MPC" [level=3] [ref=f52e918]
                        - generic [ref=f52e919]:
                          - text: "A conventional MPC formulation for a dynamic system, such as (6), is defined by the following cost function J:"
                          - generic [ref=f52e920]: (8)
                          - text: "where C(·) represents the instantaneous cost, J is the total cost over the prediction horizon, and is the set of control inputs from time step k to k + n − 1. The objective is to determine the optimal sequence of control inputs that minimizes J. By employing a receding horizon approach, the optimal control sequence is obtained at each time step by solving the following optimization problem:"
                          - generic [ref=f52e1031]: (9)
                        - generic [ref=f52e1117]:
                          - text: "In this study, the control objective for BTMS is to maintain battery temperature within the optimal operating range while minimizing energy consumption. Consequently, the cost function comprises three components: the power consumption cost, the temperature cost, and the mode change cost. The BTMS operates in two distinct cooling modes—refrigeration cycle mode and radiator mode—where mode transitions involve compressor activation. Frequent mode switching can negatively impact system longevity; thus, the cost function incorporates a penalty for mode changes as follows:"
                          - generic [ref=f52e1118]: (10)
                          - text: where α, β, and γ are the weighting factors.
                        - generic [ref=f52e1171]:
                          - text: The power consumption cost,
                          - generic [ref=f52e1172]:
                            - text: C
                            - subscript [ref=f52e1173]: P
                          - text: "(k), represents the sum of electric power consumed by the compressor and the pump:"
                          - generic [ref=f52e1174]: (11)
                        - generic [ref=f52e1209]:
                          - text: The temperature cost,
                          - generic [ref=f52e1210]:
                            - text: C
                            - subscript [ref=f52e1211]: T
                          - text: (k), is expressed as
                          - generic [ref=f52e1212]: (12)
                          - text: where ζ is a design parameter. Based on previous studies [
                          - link "Reference 33" [ref=f52e1326] [cursor=pointer]: "33"
                          - text: "] and current industry practices, which typically regulate battery temperature around 30 °C, this study defines the optimal operating range as 27 °C and 33 °C. The mode change cost,"
                          - generic [ref=f52e1327]:
                            - text: C
                            - subscript [ref=f52e1328]: mode
                          - text: (k), is defined as 0 when the mode remains unchanged from the previous step and 1 otherwise. The weighting factor β penalizes frequent mode transitions within the prediction horizon. The speed variation cost is represented by
                          - generic [ref=f52e1329]:
                            - text: C
                            - subscript [ref=f52e1330]: spd rate
                          - text: "(k) and formulated as follows:"
                          - generic [ref=f52e1331]: (13)
                      - generic [ref=f52e1382]:
                        - heading "3.2. Mode Change Sensitivity in Conventional MPC" [level=3] [ref=f52e1383]
                        - generic [ref=f52e1384]:
                          - text: The prediction horizon cannot be arbitrarily extended due to computational complexity and the diminishing accuracy of long-term predictions. In this study, the prediction horizon is set to 60 s. Given that mode switching events are relatively infrequent over this duration, the penalty term β for excessive switching fails to effectively regulate mode transitions.
                          - link "Figure 10" [ref=f52e1385] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f010"
                          - text: illustrates the mode change behavior of conventional MPC for different values. The results indicate excessive sensitivity of mode change behavior to the weighting factor β, making it challenging to fine-tune the cost function. To address this issue, this study proposes an infinite-horizon MPC framework, which accounts for mode transitions over an extended horizon, improving stability and robustness.
                        - generic [ref=f52e1386]:
                          - button [aria-hidden] [ref=f52e1387] [cursor=pointer]
                          - button "View figure 10" [ref=f52e1392] [cursor=pointer]
                          - generic [ref=f52e1393]: "Figure 10. Mode change behavior of conventional MPC: (a) result with β = 30.5, (b) result with β = 30.7, (c) result with β = 30.9."
                      - generic [ref=f52e1394]:
                        - heading "3.3. Infinity-Horizon MPC" [level=3] [ref=f52e1395]
                        - generic [ref=f52e1396]: The excessive sensitivity of mode change behavior in conventional MPC to control parameters arises from the low probability of a mode transition occurring within the prediction horizon. To mitigate the issue of overly frequent mode changes, we aim to design an MPC framework with an infinite horizon while maintaining minimal computational load.
                        - generic [ref=f52e1397]:
                          - text: "The cost function for infinite-horizon MPC is defined as follows:"
                          - generic [ref=f52e1398]: (14)
                          - text: where C(k) is the cost function defined in (10) and μ is a discount factor that stabilizes the optimization by preventing the cost from increasing indefinitely.
                        - generic [ref=f52e1477]:
                          - text: "The optimal cost and corresponding optimal control inputs are computed as follows:"
                          - generic [ref=f52e1478]: (15)
                        - generic [ref=f52e1836]:
                          - text: "In this formulation, the first term in the bracket can be computed similarly to conventional MPC. However, the second term cannot be evaluated using the conventional approach. If statistical information about disturbances and system dynamics is available, the most probable value of the second term can be estimated in a statistical sense, i.e., as an expected value. This allows us to approximate the second term as follows:"
                          - generic [ref=f52e1837]: (16)
                        - generic [ref=f52e1906]:
                          - text: This function represents the minimum expected cost from the current state x
                          - subscript [ref=f52e1907]: "0"
                          - text: to an infinite time horizon, commonly referred to as the value function. The value function can be precomputed over the state space through a stochastic optimization process. One effective approach to such optimization is Stochastic Dynamic Programming (SDP). Within the SDP framework, the value function V(x) and the corresponding optimal policy are reformulated as
                          - generic [ref=f52e1908]: (17)
                          - generic [ref=f52e1965]: (18)
                          - text: where x′ denotes the next state, X is the admissible state space, and p
                          - subscript [ref=f52e2023]: xu,x′
                          - text: is the state transition probability from a state x to another state x′ under the control input u. The optimal policy can be obtained through the value iteration algorithm, as shown in Algorithm 1.
