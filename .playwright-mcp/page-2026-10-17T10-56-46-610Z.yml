                    - generic [ref=f52e2366]:
                      - heading "5. Conclusions" [level=2] [ref=f52e2367]
                      - generic [ref=f52e2368]: In this study, a Model Predictive Control (MPC) strategy for the Electric Vehicle Battery Thermal Management System (EV BTMS) was proposed to maintain the battery temperature within the optimal operating range while minimizing energy consumption. To ensure real-time performance and reliability, a high-fidelity model of the EV BTMS was developed using MATLAB/Simscape. Additionally, an artificial neural network (ANN)-based model was designed using data from the high-fidelity model. The ANN-based model was verified to accurately approximate the characteristics of the EV BTMS while maintaining a low computational load.
                      - generic [ref=f52e2369]: To address the issue of oscillatory control inputs observed in conventional MPC, a modified MPC framework was introduced. This framework incorporated a value function that captures the system’s characteristics beyond the prediction horizon, extending to an infinite time horizon.
                      - generic [ref=f52e2370]: The proposed controller was evaluated by comparing its performance with that of a conventional rule-based controller. The results demonstrated that under sufficiently low ambient temperatures, the proposed controller effectively utilized the radiator mode, leading to a 78.42% reduction in energy consumption compared to the rule-based controller. In scenarios where the ambient temperature was close to the battery temperature, the system dynamically adjusted its mode based on the battery’s heat generation and current temperature, resulting in a 42.52% reduction in energy consumption. Under high ambient temperatures, the proposed controller optimized actuator usage more efficiently than the rule-based controller, achieving a 30.05% reduction in energy consumption.
                      - generic [ref=f52e2371]: In all tested conditions, the proposed controller successfully maintained the battery temperature within the desired operating range. Additionally, the controller effectively suppressed unnecessary fluctuations in actuator operation, enhancing system stability and longevity.
                      - generic [ref=f52e2372]: This study aimed to achieve real-time operation by designing the controller with a reduced number of states while maintaining an acceptable level of model accuracy. For future work, we intend to improve control performance by incorporating a greater number of states into the MPC’s future cost by transitioning from an SDP-based value function to a learning-based value approximation approach.
