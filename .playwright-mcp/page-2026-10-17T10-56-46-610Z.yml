                            - text: "]."
                        - generic [ref=f52e733]: Model validation involved comparing ANN-based model outputs with results from simulations. In refrigeration mode, validation was performed using a pressure–enthalpy diagram and by comparing coolant temperature differences at the battery inlet and outlet. Battery temperature predictions from the ANN-based model were also compared to MATLAB/Simscape results. In radiator mode, validation followed the same methodology.
                        - generic [ref=f52e734]:
                          - link "Figure 8" [ref=f52e735] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f008"
                          - text: and
                          - link "Figure 9" [ref=f52e736] [cursor=pointer]:
                            - /url: "#wevj-16-00279-f009"
                          - text: show validation results for both modes, where blue lines represent MATLAB/Simscape results and red lines denote ANN-based model results. In both modes, the battery temperatures predicted by the ANN model and those obtained from the MATLAB/Simscape simulations exhibited high accuracy, with RMSE values of 0.2150 for the refrigeration cycle mode and 0.0554 for radiator mode. Due to the greater complexity of the refrigeration cycle compared to the radiator cycle, the ANN model exhibited slightly higher prediction error in the former. Nevertheless, the accuracy achieved in both modes is sufficient for control applications. Moreover, the ANN-based models required only 0.004% of a single simulation step, confirming their suitability for model-based controller design in terms of accuracy and computational efficiency.
