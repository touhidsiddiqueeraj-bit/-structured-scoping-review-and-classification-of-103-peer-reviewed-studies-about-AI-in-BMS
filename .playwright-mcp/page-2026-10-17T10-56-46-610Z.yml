                          - text: ) was developed for data collection using R-134a as the refrigerant and a 50–50 mixture of water and ethylene glycol as the coolant. Mode transitions were assumed to be ideally controlled by valves. Training data were generated from steady-state outputs by varying outdoor temperature, battery temperature, compressor speed, and pump speed.
